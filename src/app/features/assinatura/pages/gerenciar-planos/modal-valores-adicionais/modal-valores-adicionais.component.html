<header class="dlg-cabecalho">
  <div>
    <h2 mat-dialog-title class="dlg-titulo">Valores adicionais</h2>
    <p class="dlg-subtitulo">
      Quanto a clínica paga por mês por cada usuário além do que o plano inclui.
    </p>
  </div>
  <button type="button" class="dlg-fechar" (click)="cancelar()" aria-label="Fechar">
    <mat-icon>close</mat-icon>
  </button>
</header>

<div class="dlg-corpo">
  <table class="matriz">
    <thead>
      <tr>
        <th scope="col">Usuário extra</th>
        <th scope="col" *ngFor="let plano of planos">{{ plano.nome }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let perfil of perfis">
        <th scope="row">{{ perfil.rotulo }}</th>
        <td *ngFor="let plano of planos">
          <span class="entrada"
                [class.entrada--alterada]="alterado(plano, perfil.campo)"
                [class.entrada--erro]="negativo(plano, perfil.campo)">
            <span class="entrada-prefixo">R$</span>
            <input type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00"
                   [ngModel]="valor(plano, perfil.campo)" (ngModelChange)="definir(plano, perfil.campo, $event)"
                   [disabled]="salvando"
                   [attr.aria-label]="perfil.rotulo + ' extra no plano ' + plano.nome">
          </span>
        </td>
      </tr>
    </tbody>
  </table>

  <p class="nota" *ngIf="temErro" role="alert">Os valores não podem ser negativos.</p>
</div>

<footer class="dlg-rodape">
  <span class="dlg-rodape-info" aria-live="polite">
    <ng-container *ngIf="planosAlterados.length === 0">Nenhuma alteração</ng-container>
    <ng-container *ngIf="planosAlterados.length === 1">1 plano alterado</ng-container>
    <ng-container *ngIf="planosAlterados.length > 1">{{ planosAlterados.length }} planos alterados</ng-container>
  </span>
  <button type="button" class="btn btn--texto" (click)="cancelar()">Cancelar</button>
  <button type="button" class="btn btn--primario" (click)="salvar()"
          [disabled]="salvando || temErro || planosAlterados.length === 0">
    <mat-spinner *ngIf="salvando" diameter="16" class="btn-spinner"></mat-spinner>
    {{ salvando ? 'Salvando...' : 'Salvar valores' }}
  </button>
</footer>
