<h2 mat-dialog-title>
  <i class="fa-solid fa-dollar-sign"></i>
  Valores Adicionais por Plano
</h2>

<mat-dialog-content>
  <p class="modal-description">
    Configure os valores adicionais para cada tipo de usuário extra em cada plano.
  </p>
  
  <div class="planos-valores-grid">
    <div class="plano-valores-card" *ngFor="let plano of planos">
      <div class="plano-card-header">
        <h3>{{ plano.nome }}</h3>
        <span class="tipo-badge" [class]="'tipo-' + plano.tipo.toLowerCase()">{{ plano.tipo }}</span>
      </div>
      
      <div class="valores-list">
        <div class="valor-item">
          <div class="valor-label">
            <i class="fa-solid fa-user-shield"></i>
            <span>Admin Clínico</span>
          </div>
          <mat-form-field appearance="outline" class="valor-input">
            <mat-label>R$</mat-label>
            <input matInput type="number" 
              [value]="plano.valorAdicionalAdmin"
              (input)="atualizarValor(plano.id, 'admin', $event)"
              min="0" step="0.01">
          </mat-form-field>
        </div>
        
        <div class="valor-item">
          <div class="valor-label">
            <i class="fa-solid fa-user-doctor"></i>
            <span>Profissional</span>
          </div>
          <mat-form-field appearance="outline" class="valor-input">
            <mat-label>R$</mat-label>
            <input matInput type="number" 
              [value]="plano.valorAdicionalProfissional"
              (input)="atualizarValor(plano.id, 'profissional', $event)"
              min="0" step="0.01">
          </mat-form-field>
        </div>
        
        <div class="valor-item">
          <div class="valor-label">
            <i class="fa-solid fa-user-pen"></i>
            <span>Secretária</span>
          </div>
          <mat-form-field appearance="outline" class="valor-input">
            <mat-label>R$</mat-label>
            <input matInput type="number" 
              [value]="plano.valorAdicionalSecretaria"
              (input)="atualizarValor(plano.id, 'secretaria', $event)"
              min="0" step="0.01">
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="salvar()">
    <i class="fa-solid fa-save"></i>
    Salvar Alterações
  </button>
</mat-dialog-actions>
